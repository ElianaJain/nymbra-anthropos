<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="system-ui,-apple-system,sans-serif">
<title>Bipedal gait cycle — skeletal load concentration by phase</title>
<desc>Six phases of the human gait cycle shown as simplified skeletal figures with load indicator bars showing stress at the hip, knee, and SIJ during each phase.</desc>

<rect width="680" height="440" fill="#fafaf7"/>

<text font-size="12" fill="#6b7280" x="340" y="18" text-anchor="middle">Bipedal gait cycle — skeletal load concentration by phase</text>
<text font-size="9" fill="#9ca3af" x="340" y="32" text-anchor="middle">Stance phase ≈ 60% of cycle · Single-leg stance concentrates full body weight at hip, knee, and SIJ · foundation for DC-1.1, DC-4.1</text>

<!-- PHASE 1: HEEL STRIKE -->
<text font-size="11" font-weight="600" fill="#374151" x="56" y="54" text-anchor="middle">Heel strike</text>
<line x1="20" y1="290" x2="92" y2="290" stroke="#d1d5db" stroke-width="1"/>
<ellipse cx="56" cy="100" rx="12" ry="14" fill="none" stroke="#374151" stroke-width="1.5"/>
<line x1="56" y1="114" x2="56" y2="160" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M56 160 Q44 165 32 162" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M56 160 Q68 180 72 210 L66 290" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<line x1="66" y1="290" x2="76" y2="291" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M56 160 Q50 200 46 240 Q44 270 48 290" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.5"/>
<rect x="22" y="306" width="68" height="7" rx="2" fill="#DC2626" opacity="0.7"/>
<rect x="22" y="316" width="42" height="6" rx="2" fill="#D97706" opacity="0.7"/>
<rect x="22" y="325" width="55" height="5" rx="2" fill="#1D4ED8" opacity="0.6"/>
<text font-size="9" fill="#9ca3af" x="56" y="342" text-anchor="middle">high impact</text>
<text font-size="9" fill="#1D4ED8" x="56" y="352" text-anchor="middle">DC-1.1</text>

<!-- PHASE 2: LOADING RESPONSE -->
<text font-size="11" font-weight="600" fill="#374151" x="169" y="54" text-anchor="middle">Loading response</text>
<line x1="133" y1="290" x2="205" y2="290" stroke="#d1d5db" stroke-width="1"/>
<ellipse cx="169" cy="100" rx="12" ry="14" fill="none" stroke="#374151" stroke-width="1.5"/>
<line x1="169" y1="114" x2="169" y2="160" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M169 160 Q157 165 145 162" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M169 160 Q178 182 182 218 L180 290" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<line x1="174" y1="290" x2="186" y2="290" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M169 160 Q162 200 160 250 Q158 270 162 290" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.5"/>
<rect x="135" y="306" width="68" height="7" rx="2" fill="#DC2626" opacity="0.7"/>
<rect x="135" y="316" width="60" height="6" rx="2" fill="#D97706" opacity="0.7"/>
<rect x="135" y="325" width="50" height="5" rx="2" fill="#1D4ED8" opacity="0.6"/>
<text font-size="9" fill="#9ca3af" x="169" y="342" text-anchor="middle">peak SIJ load</text>
<text font-size="9" fill="#1D4ED8" x="169" y="352" text-anchor="middle">DC-1.1 DC-4.1</text>

<!-- PHASE 3: MIDSTANCE -->
<text font-size="11" font-weight="600" fill="#374151" x="282" y="54" text-anchor="middle">Midstance</text>
<line x1="246" y1="290" x2="318" y2="290" stroke="#d1d5db" stroke-width="1"/>
<ellipse cx="282" cy="100" rx="12" ry="14" fill="none" stroke="#374151" stroke-width="1.5"/>
<line x1="282" y1="114" x2="282" y2="160" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M282 160 Q270 165 258 162" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<line x1="282" y1="160" x2="282" y2="290" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
<line x1="282" y1="290" x2="292" y2="290" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M282 160 Q290 200 294 260 Q296 275 292 290" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.4"/>
<rect x="248" y="306" width="68" height="7" rx="2" fill="#DC2626" opacity="0.7"/>
<rect x="248" y="316" width="68" height="6" rx="2" fill="#D97706" opacity="0.7"/>
<rect x="248" y="325" width="60" height="5" rx="2" fill="#1D4ED8" opacity="0.6"/>
<text font-size="9" fill="#9ca3af" x="282" y="342" text-anchor="middle">single-leg max</text>
<text font-size="9" fill="#1D4ED8" x="282" y="352" text-anchor="middle">DC-1.2 DC-1.3</text>

<!-- PHASE 4: TOE-OFF -->
<text font-size="11" font-weight="600" fill="#374151" x="395" y="54" text-anchor="middle">Toe-off</text>
<line x1="359" y1="290" x2="431" y2="290" stroke="#d1d5db" stroke-width="1"/>
<ellipse cx="395" cy="100" rx="12" ry="14" fill="none" stroke="#374151" stroke-width="1.5"/>
<line x1="395" y1="114" x2="395" y2="160" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M395 160 Q383 165 371 162" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M395 160 Q390 200 380 240 L372 290" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M372 290 Q376 285 386 290" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M395 160 Q402 196 408 248 Q412 275 407 290" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
<rect x="361" y="306" width="40" height="7" rx="2" fill="#DC2626" opacity="0.7"/>
<rect x="361" y="316" width="50" height="6" rx="2" fill="#D97706" opacity="0.7"/>
<rect x="361" y="325" width="30" height="5" rx="2" fill="#1D4ED8" opacity="0.6"/>
<text font-size="9" fill="#9ca3af" x="395" y="342" text-anchor="middle">ankle push-off</text>
<text font-size="9" fill="#1D4ED8" x="395" y="352" text-anchor="middle">DC-2.3 elastic</text>

<!-- PHASE 5: SWING -->
<text font-size="11" font-weight="600" fill="#374151" x="508" y="54" text-anchor="middle">Swing phase</text>
<line x1="472" y1="290" x2="544" y2="290" stroke="#d1d5db" stroke-width="1"/>
<ellipse cx="508" cy="100" rx="12" ry="14" fill="none" stroke="#374151" stroke-width="1.5"/>
<line x1="508" y1="114" x2="508" y2="160" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M508 160 Q496 165 484 162" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<line x1="508" y1="160" x2="504" y2="290" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
<line x1="500" y1="290" x2="512" y2="290" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M508 160 Q524 186 530 216 Q536 240 526 260" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<path d="M526 260 Q528 272 522 278" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<rect x="474" y="306" width="22" height="7" rx="2" fill="#DC2626" opacity="0.7"/>
<rect x="474" y="316" width="18" height="6" rx="2" fill="#D97706" opacity="0.7"/>
<rect x="474" y="325" width="24" height="5" rx="2" fill="#1D4ED8" opacity="0.6"/>
<text font-size="9" fill="#9ca3af" x="508" y="342" text-anchor="middle">~40% of cycle</text>
<text font-size="9" fill="#1D4ED8" x="508" y="352" text-anchor="middle">low load phase</text>

<!-- PHASE 6: TERMINAL SWING -->
<text font-size="11" font-weight="600" fill="#374151" x="621" y="54" text-anchor="middle">Terminal swing</text>
<line x1="585" y1="290" x2="657" y2="290" stroke="#d1d5db" stroke-width="1"/>
<ellipse cx="621" cy="100" rx="12" ry="14" fill="none" stroke="#374151" stroke-width="1.5"/>
<line x1="621" y1="114" x2="621" y2="160" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M621 160 Q609 165 597 162" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<line x1="621" y1="160" x2="617" y2="290" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
<line x1="613" y1="290" x2="625" y2="290" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
<path d="M621 160 Q632 188 638 240 L634 290" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
<line x1="630" y1="290" x2="642" y2="290" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
<rect x="587" y="306" width="50" height="7" rx="2" fill="#DC2626" opacity="0.7"/>
<rect x="587" y="316" width="35" height="6" rx="2" fill="#D97706" opacity="0.7"/>
<rect x="587" y="325" width="42" height="5" rx="2" fill="#1D4ED8" opacity="0.6"/>
<text font-size="9" fill="#9ca3af" x="621" y="342" text-anchor="middle">pre-impact load</text>
<text font-size="9" fill="#1D4ED8" x="621" y="352" text-anchor="middle">→ heel strike again</text>

<!-- Cycle return arrow -->
<path d="M650 378 Q665 393 340 406 Q15 393 30 378" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="5 4"/>
<text font-size="9" fill="#9ca3af" x="340" y="420" text-anchor="middle">Cycle repeats — cumulative loading accumulates over thousands of cycles per day → DC-3.3 monitoring requirement</text>

<!-- Legend -->
<rect x="190" y="360" width="300" height="52" rx="3" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
<rect x="204" y="372" width="20" height="8" rx="2" fill="#DC2626" opacity="0.7"/>
<text font-size="9" fill="#6b7280" x="230" y="380">hip / SIJ load (DC-4.1)</text>
<rect x="204" y="386" width="20" height="8" rx="2" fill="#D97706" opacity="0.7"/>
<text font-size="9" fill="#6b7280" x="230" y="394">knee load (DC-4.1)</text>
<rect x="300" y="372" width="20" height="8" rx="2" fill="#1D4ED8" opacity="0.6"/>
<text font-size="9" fill="#6b7280" x="326" y="380">SIJ nutation (DC-1.1)</text>
<text font-size="9" fill="#9ca3af" x="300" y="400">bar width = relative load magnitude</text>
</svg>
